[package]
name = "podpilot"
version = "0.1.0"
description = "Launch a RunPod model and wire it into local coding agents"
authors = ["Eray Dogan"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "podpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
