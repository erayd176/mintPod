[package]
name = "podpilot"
version = "0.1.0"
description = "Launch a RunPod model and wire it into local coding agents"
authors = ["Eray Dogan"]
license = "MIT"
edition = "2024"
rust-version = "1.88"

[lib]
name = "podpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "podpilot"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[features]
default = ["desktop-runtime"]
desktop-runtime = ["dep:tauri", "tauri/wry"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jsonschema = { version = "0.49", default-features = false }
keyring = "4.1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = [], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
